<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Submit Request</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <header>
        <h1>Request Form</h1>
    </header>

    <main>
        <!-- Second Form Details -->
        <form action="#" method="POST" class="custom-form">
            <h2>Apni Request Detail Fill Karein</h2>
            
            <label for="service">Service/Topic:</label>
            <input type="text" id="service" name="service" placeholder="Kiske baare me request hai?" required>

            <label for="message">Detail Message:</label>
            <textarea id="message" name="message" rows="4" placeholder="Yahan apni puri request likhein..." style="width: 100%; padding: 10px; margin-bottom: 15px; border-radius: 6px; border: 1px solid #ccc;"></textarea>

            <button type="submit" class="btn submit-btn">Final Submit</button>
        </form>
    </main>

</body>
</html>
