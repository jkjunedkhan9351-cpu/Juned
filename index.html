<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome to My Website</title>
    <!-- CSS file link -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <!-- Action Buttons Section -->
        <div class="button-group">
            <!-- Call Button -->
            <a href="tel:+916375620535" class="btn call-btn">
                <i class="fas fa-phone"></i> Call Now
            </a>

            <!-- WhatsApp Button -->
            <a href="https://wa.me/916375620535" target="_blank" class="btn whatsapp-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp Us
            </a>
        </div>

        <!-- Button to open popup form -->
        <button class="btn submit-btn" onclick="openForm()">Submit Request</button>

        <!-- Popup Form Overlay -->
        <div id="popupForm" class="modal-overlay">
            <div class="modal-content">
                <span class="close-btn" onclick="closeForm()">&times;</span>
                <h2>Submit Request</h2>
                
                <form action="request.htm" method="GET">
                    <label for="name">Name:</label>
                    <input type="text" id="name" name="name" placeholder="Apna pura naam likhein" required>

                    <label for="phone">Phone Number:</label>
                    <input type="tel" id="phone" name="phone" placeholder="Apna mobile number likhein" required>

                    <label for="email">Gmail ID:</label>
                    <input type="email" id="email" name="email" placeholder="example@gmail.com" required>

                    <label for="password">Password:</label>
                    <input type="password" id="password" name="password" placeholder="Password enter karein" required>

                    <label for="issue">Description Issue:</label>
                    <textarea id="issue" name="issue" rows="4" placeholder="Apni dikkat ya request yahan detail me likhein..." required></textarea>

                    <button type="submit" class="btn submit-btn">Submit Request</button>
                </form>
            </div>
        </div>
    </main>

    <!-- JavaScript for Popup -->
    <script>
        function openForm() {
            document.getElementById("popupForm").style.display = "flex";
        }

        function closeForm() {
            document.getElementById("popupForm").style.display = "none";
        }

        // Close modal when clicking outside box
        window.onclick = function(event) {
            var modal = document.getElementById("popupForm");
            if (event.target == modal) {
                modal.style.display = "none";
            }
        }
    </script>

</body>
</html>
