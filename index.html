<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Website</title>
    <!-- CSS file link -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Font Awesome (Icons ke liye) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>

    <header>
        <h1>Welcome to My Website</h1>
    </header>

    <main>
        <!-- Action Buttons Section -->
        <div class="button-group">
            <!-- Call Button -->
            <a href="tel:+916375620535" class="btn call-btn">
                <i class="fas fa-phone"></i> Call Now
            </a>

            <!-- WhatsApp Button -->
            <a href="https://wa.me/916375620535" target="_blank" class="btn whatsapp-btn">
                <i class="fab fa-whatsapp"></i> WhatsApp Us
            </a>
        </div>

        <!-- Form with Submit Request Button -->
        <!-- 'action' me request.htm dala hai taaki click karne par request.htm page khule -->
        <form action="request.htm" method="GET" class="custom-form">
            <h2>Contact Us</h2>
            
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" placeholder="Apna naam likhein" required>

            <label for="phone">Phone:</label>
            <input type="tel" id="phone" name="phone" placeholder="Apna mobile number likhein" required>

            <!-- Submit Request Button -->
            <button type="submit" class="btn submit-btn">Submit Request</button>
        </form>
    </main>

</body>
</html>
